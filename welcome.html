<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>INSITE — Welcome</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="onboarding.css">

</head>


<body>

  <main class="onboarding-app">

    <section class="welcome-screen">


      <!-- ==================== TOP ==================== -->

      <div class="welcome-top">

        <div class="progress-line">

          <span class="progress-active"></span>

          <span class="progress-inactive"></span>

        </div>

      </div>


      <!-- ==================== BRAND ==================== -->

      <div class="welcome-brand">

        <img
          src="logo.svg"
          alt="INSITE"
          class="welcome-logo"
        >

      </div>


      <!-- ==================== VISUAL ==================== -->

      <div class="welcome-visual">

        <div class="visual-circle visual-circle-one"></div>

        <div class="visual-circle visual-circle-two"></div>

        <div class="visual-map">

          <span></span>
          <span></span>
          <span></span>

        </div>

        <div class="visual-pin">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >

            <path
              d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"
            ></path>

            <circle
              cx="12"
              cy="10"
              r="2.5"
            ></circle>

          </svg>

        </div>

      </div>


      <!-- ==================== CONTENT ==================== -->

      <div class="welcome-content">

        <h1>
          Indoor Map &<br>
          Navigation
        </h1>

        <p>
          Bản đồ tòa nhà và hệ thống
          định vị không gian
        </p>

      </div>


      <!-- ==================== CTA ==================== -->

      <div class="welcome-bottom">

        <button
          class="welcome-button"
          id="continueButton"
          type="button"
        >
          Tiếp tục
        </button>

      </div>


    </section>

  </main>


  <script src="onboarding.js"></script>

</body>

</html>
