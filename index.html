<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>INSITE — Home</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Navbar CSS -->
  <link rel="stylesheet" href="navbar.css" />
</head>


<body>

  <main class="app">

    <!-- ==================== HOME ==================== -->

    <section class="screen" id="homeScreen" data-page="home">


<!-- ==================== SEARCH ==================== -->

<div class="search-bar" id="searchBar">

  <button
  class="search-button"
  id="searchButton"
  aria-label="Search"
>

  <!-- Search icon -->
  <svg
    class="search-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <circle
      cx="11"
      cy="11"
      r="7"
    ></circle>

    <path
      d="M20 20L16 16"
    ></path>
  </svg>


  <!-- Placeholder -->
  <span class="search-placeholder">
    Where do you want to go?
  </span>

</button>


  <!-- Voice search -->

  <button
    class="search-voice-button"
    id="voiceButton"
    aria-label="Search by voice"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >

      <rect
        x="9"
        y="3"
        width="6"
        height="12"
        rx="3"
      ></rect>

      <path
        d="M5 11a7 7 0 0 0 14 0"
      ></path>

      <path
        d="M12 18v3"
      ></path>

      <path
        d="M9 21h6"
      ></path>

    </svg>

  </button>

</div>


 <!-- ==================== DAILY ==================== -->

<section class="section map-section">

  <div class="section-heading">

    <h2>
      <span class="section-square"></span>
      Hàng ngày
    </h2>

  </div>


<button
  class="map-card daily-map-card"
  id="dailyMapCard"
  type="button"
>

  <img
    src="indoormap1.svg"
    alt="Indoor map"
  >

</button>

</section>


<!-- ==================== CURRENT LOCATION ==================== -->

<section class="section map-section current-location-section">

  <div class="section-heading">

    <h2>
      <span class="section-square"></span>
      Vị trí hiện tại
    </h2>

  </div>


<button
  class="map-card current-map-card"
  id="currentMapViewport"
  type="button"
>

  <img
    src="map2.svg"
    alt="Current location map"
    id="currentMap"
    draggable="false"
  >

</button>

</section>







      <!-- ==================== SHARED NAVBAR ==================== -->

      <div id="navbar"></div>


    </section>

  </main>


  <!-- Main JavaScript -->
  <script src="script.js"></script>

</body>

</html>
