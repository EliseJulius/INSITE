<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>INSITE — Cá nhân</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Bottom Navbar CSS -->
  <link rel="stylesheet" href="navbar.css">
</head>

<body>

  <main class="app">

    <section
      class="screen profile-screen"
      data-page="profile"
    >

      <!-- ==================== HEADER ==================== -->

      <header class="page-header profile-header">

        <button
          class="back-button"
          id="profileBackButton"
          aria-label="Quay lại"
          type="button"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 18L9 12L15 6"></path>
          </svg>
        </button>

        <h1>Cá nhân</h1>

      </header>


      <!-- ==================== PROFILE CONTENT ==================== -->

      <section class="profile-content">

        <!-- PROFILE CARD -->

        <button
          class="profile-account-card"
          id="profileAccountButton"
          type="button"
          aria-label="Thông tin tài khoản"
        >

          <div class="profile-avatar">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="8"
                r="4"
                fill="currentColor"
              ></circle>

              <path
                d="M5 20C5 16.6863 8.13401 14 12 14C15.866 14 19 16.6863 19 20"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <div class="profile-account-info">

            <strong>Bảo Anh</strong>

            <span>Quản lí hồ sơ</span>

          </div>

        </button>


        <!-- ==================== SETTINGS LIST ==================== -->

        <div class="profile-menu">


          <!-- THÔNG BÁO -->

          <button
            class="profile-menu-item"
            type="button"
            data-action="notifications"
          >

            <span class="profile-menu-icon">

              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M12 22a2.5 2.5 0 0 0 2.35-1.65h-4.7A2.5 2.5 0 0 0 12 22ZM19 17v-5.5c0-3.22-1.72-5.72-4.65-6.42V4.5a2.35 2.35 0 1 0-4.7 0v.58C6.72 5.78 5 8.28 5 11.5V17l-2 2v1h18v-1l-2-2Z"
                ></path>
              </svg>

            </span>

            <span class="profile-menu-label">
              Thông báo
            </span>

            <svg
              class="profile-menu-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18L15 12L9 6"></path>
            </svg>

          </button>


          <!-- CÀI ĐẶT CỠ CHỮ -->

          <button
            class="profile-menu-item"
            type="button"
            data-action="text-size"
          >

            <span class="profile-menu-icon">

              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm0 16.5A7.5 7.5 0 1 1 19.5 12 7.51 7.51 0 0 1 12 19.5Z"
                ></path>

                <path
                  d="M8 15h1.5l.8-2h3.4l.8 2H16l-3.5-8h-1L8 15Zm4-5.7 1.1 2.7h-2.2L12 9.3Z"
                ></path>
              </svg>

            </span>

            <span class="profile-menu-label">
              Cài đặt cỡ chữ
            </span>

            <svg
              class="profile-menu-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18L15 12L9 6"></path>
            </svg>

          </button>


          <!-- TRUNG TÂM HỖ TRỢ -->

          <button
            class="profile-menu-item"
            type="button"
            data-action="help"
          >

            <span class="profile-menu-icon">

              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                ></circle>

                <path
                  d="M9.6 9.2a2.5 2.5 0 0 1 4.8 1c0 1.8-2.4 2-2.4 3.6"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="2"
                  stroke-linecap="round"
                ></path>

                <circle
                  cx="12"
                  cy="17"
                  r="1"
                  fill="#FFFFFF"
                ></circle>
              </svg>

            </span>

            <span class="profile-menu-label">
              Trung tâm hỗ trợ
            </span>

            <svg
              class="profile-menu-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18L15 12L9 6"></path>
            </svg>

          </button>


          <!-- QUYỀN RIÊNG TƯ -->

          <button
            class="profile-menu-item"
            type="button"
            data-action="privacy"
          >

            <span class="profile-menu-icon">

              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M12 2 5 5v5.5c0 4.55 2.92 8.8 7 10.5 4.08-1.7 7-5.95 7-10.5V5l-7-3Z"
                ></path>

                <path
                  d="M12 7v6"
                  stroke="#FFFFFF"
                  stroke-width="2"
                  stroke-linecap="round"
                ></path>

                <circle
                  cx="12"
                  cy="16"
                  r="1"
                  fill="#FFFFFF"
                ></circle>
              </svg>

            </span>

            <span class="profile-menu-label">
              Quyền riêng tư
            </span>

            <svg
              class="profile-menu-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18L15 12L9 6"></path>
            </svg>

          </button>


          <!-- THÊM / SỬA BẢN ĐỒ -->

          <a
            class="profile-menu-item profile-menu-link"
            href="add-map.html"
          >

            <span class="profile-menu-icon">

              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M19 3h-4V1h-2v2H7a2 2 0 0 0-2 2v6H3v2h2v6a2 2 0 0 0 2 2h6v2h2v-2h4a2 2 0 0 0 2-2v-4h-2v4H7v-6h6v-2H7V5h6v2h2V5h4v6h2V5a2 2 0 0 0-2-2Z"
                ></path>

                <path
                  d="M17 13v3h-3v2h3v3h2v-3h3v-2h-3v-3h-2Z"
                ></path>
              </svg>

            </span>

            <span class="profile-menu-label">
              Thêm/ sửa bản đồ
            </span>

            <svg
              class="profile-menu-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18L15 12L9 6"></path>
            </svg>

          </a>

        </div>

      </section>


      <!-- ==================== NAVBAR ==================== -->

      <div id="navbar"></div>

    </section>

  </main>


  <!-- Main Script -->
  <script src="script.js"></script>

  <!-- Profile interactions -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      /* Back button */
      const backButton =
        document.getElementById("profileBackButton");

      if (backButton) {
        backButton.addEventListener("click", () => {
          window.history.back();
        });
      }


      /* Account */
      const accountButton =
        document.getElementById("profileAccountButton");

      if (accountButton) {
        accountButton.addEventListener("click", () => {
          console.log("Profile account clicked");
        });
      }


      /* Menu items */
      const menuItems =
        document.querySelectorAll(
          ".profile-menu-item[data-action]"
        );

      menuItems.forEach((item) => {

        item.addEventListener("click", () => {

          const action =
            item.dataset.action;

          console.log(
            "Profile action:",
            action
          );

        });

      });

    });
  </script>

</body>

</html>
