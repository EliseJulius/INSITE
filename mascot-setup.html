<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>INSITE — Trợ lý dẫn đường</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="mascot-setup.css">

</head>


<body>

  <main class="mascot-app">

    <section class="mascot-screen">


      <!-- ==================== TOP BAR ==================== -->

      <div class="mascot-top-bar">
      </div>


      <!-- ==================== CONTENT ==================== -->

      <div class="mascot-content">


        <!-- TITLE -->

        <h1 class="mascot-title">
          Hãy nói với Monki<br>
          nơi bạn muốn đến
        </h1>


        <!-- MASCOT -->

        <div class="mascot-image-wrap">

          <img
            id="mascotImage"
            src="monki.svg"
            alt="Monki"
          >

        </div>


        <!-- ==================== ACTIONS ==================== -->

        <div class="mascot-actions">

          <button
            class="mascot-primary-button"
            id="speakButton"
            type="button"
          >
            Nói
          </button>


          <button
            class="mascot-secondary-button"
            id="skipButton"
            type="button"
          >
            Tạm thời chưa có
          </button>

        </div>

      </div>

    </section>

  </main>


  <script src="mascot-setup.js"></script>

</body>

</html>
