<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>INSITE — Đăng ký</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="signup.css">

</head>


<body>

  <main class="signup-app">

    <section class="signup-screen">


      <!-- ==================== HEADER ==================== -->

      <header class="signup-header">

        <div class="signup-line">

          <span></span>
          <span></span>

        </div>


        <div class="signup-brand">
          InSite
        </div>

      </header>


      <!-- ==================== CONTENT ==================== -->

      <div class="signup-content">

        <h1>
          Đăng ký
        </h1>

        <p class="signup-subtitle">
          Đăng ký tài khoản để bắt đầu
        </p>


        <!-- ==================== FORM ==================== -->

        <form
          class="signup-form"
          id="signupForm"
        >


          <!-- NAME -->

          <div class="signup-field">

            <label for="fullName">
              Họ và tên
            </label>

            <input
              id="fullName"
              name="fullName"
              type="text"
              placeholder="Bảo Anh"
              autocomplete="name"
              required
            >

          </div>


          <!-- EMAIL -->

          <div class="signup-field">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Abao@gmail.com"
              autocomplete="email"
              required
            >

          </div>


          <!-- DATE OF BIRTH -->

          <div class="signup-field">

            <label for="birthDate">
              Ngày sinh
            </label>

            <div class="input-with-icon">

              <input
                id="birthDate"
                name="birthDate"
                type="text"
                placeholder="12/02/1999"
                inputmode="numeric"
                autocomplete="bday"
                required
              >

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
              >

                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="16"
                  rx="2"
                ></rect>

                <path d="M16 3V7"></path>
                <path d="M8 3V7"></path>
                <path d="M3 10H21"></path>

              </svg>

            </div>

          </div>


          <!-- PHONE -->

          <div class="signup-field">

            <label for="phone">
              Số điện thoại
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="0998876543"
              autocomplete="tel"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="signup-field">

            <label for="password">
              Mật khẩu
            </label>

            <div class="input-with-icon">

              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Hiện mật khẩu"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  aria-hidden="true"
                >

                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  ></path>

                  <circle
                    cx="12"
                    cy="12"
                    r="2.5"
                  ></circle>

                </svg>

              </button>

            </div>

          </div>


          <!-- TERMS -->

          <label class="terms-check">

            <input
              type="checkbox"
              id="terms"
              required
            >

            <span>
              Tôi đồng ý với
              <a href="tos.html">
                Điều khoản dịch vụ
              </a>
              và
              <a href="tos.html">
                Chính sách quyền riêng tư
              </a>
            </span>

          </label>


          <!-- ==================== SUBMIT ==================== -->

          <button
            type="submit"
            class="signup-button"
          >
            Đăng ký
          </button>

        </form>


        <!-- ==================== LOGIN ==================== -->

        <p class="login-link">

          Đã có tài khoản?

          <a href="login.html">
            Đăng nhập
          </a>

        </p>

      </div>

    </section>

  </main>


  <script>

    /* =====================================================
       PASSWORD TOGGLE
    ===================================================== */

    const password =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");


    passwordToggle.addEventListener(
      "click",
      () => {

        const isPassword =
          password.type === "password";


        password.type =
          isPassword
            ? "text"
            : "password";


        passwordToggle.setAttribute(
          "aria-label",
          isPassword
            ? "Ẩn mật khẩu"
            : "Hiện mật khẩu"
        );

      }
    );


    /* =====================================================
       SIGN UP
    ===================================================== */

    const signupForm =
      document.getElementById("signupForm");


    signupForm.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        /*
          Prototype:
          Lưu trạng thái đăng ký.
          Sau này có thể thay bằng API / database.
        */

        localStorage.setItem(
          "insiteSignedUp",
          "true"
        );


        window.location.href =
          "tos.html";

      }
    );

  </script>

</body>

</html>
